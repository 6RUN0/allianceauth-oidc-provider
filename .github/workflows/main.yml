name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["**"]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Default to the most-restrictive token. Jobs can grant themselves
# extra scopes as needed; CI doesn't push, comment, or release, so
# read-only is sufficient for everything below.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a flurry of pushes
# doesn't queue up redundant CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (not moving tags) to
# defend against the supply-chain attack class popularised by
# CVE-2025-30066 (`tj-actions/changed-files`, March 2025). Dependabot
# (.github/dependabot.yml) keeps these current.

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Mirror pyproject's ``requires-python = ">=3.10,<3.14"``.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # ``aa-version`` selects the Alliance Auth major a job exercises.
        # The lock resolves to AA 5.x (current primary), so the default
        # ``tests`` nox session runs against AA 5 across every Python.
        # AA 4.x backward-compat is verified via the off-lock
        # ``tests_aa4`` session, fanned out one cell per interpreter so
        # a Python-specific regression points at the responsible cell.
        # Python 3.13 is excluded from AA4 — allianceauth 4.13.x's
        # ``requires-python < 3.13`` upstream cap rules it out.
        aa-version: ["5"]
        include:
          - python-version: "3.10"
            aa-version: "4"
          - python-version: "3.11"
            aa-version: "4"
          - python-version: "3.12"
            aa-version: "4"
    steps:
      # Local composite actions (``./.github/actions/...``) require the
      # repo to be checked out before the runner can find ``action.yml``.
      # See ``.github/actions/setup/action.yml`` for the upstream issue
      # reference. ``persist-credentials: false`` keeps the GITHUB_TOKEN
      # out of ``.git/config`` once checkout completes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # ``tests`` is not nox-parametrised — it runs under whichever
        # Python ``uv sync`` provisioned. ``tests_aa4`` IS parametrised
        # via ``@nox.parametrize("python_version", ...)`` and bare
        # ``-s tests_aa4`` would fan out to every AA4 Python inside one
        # cell, hiding which interpreter failed. Selecting the explicit
        # sub-session (``tests_aa4(python_version='<py>')``) keeps one
        # matrix cell = one interpreter. Matrix values are trusted (no
        # PR-controlled input), but the env passthrough still keeps
        # run-block hygiene aligned with release.yml's shell-injection
        # guard pattern.
        env:
          AA_VERSION: ${{ matrix.aa-version }}
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          if [ "$AA_VERSION" = "4" ]; then
            uv run nox -s "tests_aa4(python_version='${PY_VERSION}')"
          else
            uv run nox -s tests
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Local composite actions (``./.github/actions/...``) require the
      # repo to be checked out before the runner can find ``action.yml``.
      # See ``.github/actions/setup/action.yml`` for the upstream issue
      # reference. ``persist-credentials: false`` keeps the GITHUB_TOKEN
      # out of ``.git/config`` once checkout completes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Cache pre-commit hook environments
        # Pre-commit builds a venv per hook in ``~/.cache/pre-commit/``
        # keyed on the rev pins in ``.pre-commit-config.yaml``. The
        # caches are deterministic by config hash, so reusing them
        # across CI runs saves ~30-60s on the lint job.
        #
        # zizmor cache-poisoning: this cache is consumed only by the
        # ``lint`` job which produces no published artefact — there is
        # no path from a poisoned hook venv to a signed release wheel.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Check Django migrations are in sync with models
        # ``makemigrations --check --dry-run`` writes nothing and exits
        # non-zero if a model change would produce a fresh migration.
        # Runs before pre-commit so a model drift fails the lint job
        # in ~3s rather than masquerading as a confusing Django startup
        # error inside the longer test matrix.
        run: uv run nox -s migrations_check

      - name: Check migrations for blocking raw DDL
        # MySQL/MariaDB online-DDL gate over raw ``RunSQL`` operations:
        # a pure-AST scan (no Django boot) that flags an ``ALTER TABLE``
        # / ``CREATE INDEX`` without ``ALGORITHM=INPLACE, LOCK=NONE``.
        # Disjoint from ``migrations_check`` above, which runs
        # ``django-migration-linter`` over ORM operations but cannot read
        # raw SQL. See ``_nox/_migration_scan.py``.
        run: uv run nox -s migrations_concurrency_check

      - name: Install GNU gettext
        # ``messages_check`` shells out to ``msgfmt`` / ``msgcomm`` /
        # ``msgunfmt`` (GNU gettext) to validate the shipped catalogues.
        # The session hard-fails in CI when the toolchain is absent
        # (``_nox.shared.is_ci``), so install it before the step runs —
        # ubuntu runner images do not ship gettext by default. Mirrors
        # the install step the ``package`` job runs before
        # ``compilemessages``.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Check message catalogue integrity
        # Format-string safety, ``.po`` <-> ``.pot`` structural parity,
        # and ``.mo`` freshness across every shipped locale. Translation
        # completeness is intentionally not gated (Transifex-driven).
        run: uv run nox -s messages_check

      - name: Run linters (pre-commit)
        run: uv run nox -s lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Local composite actions (``./.github/actions/...``) require the
      # repo to be checked out before the runner can find ``action.yml``.
      # See ``.github/actions/setup/action.yml`` for the upstream issue
      # reference. ``persist-credentials: false`` keeps the GITHUB_TOKEN
      # out of ``.git/config`` once checkout completes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Run mypy + basedpyright
        run: uv run nox -s typecheck

  coverage-diff:
    # Per-PR coverage gate — distinct from the aggregate ``fail_under``
    # in ``[tool.coverage.report]``. The aggregate floor passes any PR
    # whose impact on overall coverage stays >= 96%, including a PR
    # that adds 200 lines of untested code if the existing surface
    # papers over it. ``diff-cover`` consumes the same ``coverage.xml``
    # and asserts the diff-only coverage stays >= 90%, putting the
    # pressure on the PR author to test their own changes.
    #
    # Restricted to ``pull_request`` events because the gate needs a
    # base ref to diff against. ``fetch-depth: 0`` is required so
    # diff-cover can resolve the full commit graph between HEAD and
    # the base branch.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Run coverage
        run: uv run nox -s coverage

      - name: Per-PR diff coverage gate (>= 90% on changed lines)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uvx diff-cover coverage.xml \
            --compare-branch="origin/${BASE_REF}" \
            --fail-under=90 \
            --markdown-report=diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, lint, typecheck]
    steps:
      # Local composite actions (``./.github/actions/...``) require the
      # repo to be checked out before the runner can find ``action.yml``.
      # See ``.github/actions/setup/action.yml`` for the upstream issue
      # reference. ``persist-credentials: false`` keeps the GITHUB_TOKEN
      # out of ``.git/config`` once checkout completes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Install GNU gettext
        # ``django-admin compilemessages`` shells out to ``msgfmt`` from
        # GNU gettext; ubuntu runner images don't include it by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Compile message catalogues
        run: uv run nox -s compilemessages

      - name: Build wheel + sdist
        run: uv build

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
