name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["**"]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Default to the most-restrictive token. Jobs can grant themselves
# extra scopes as needed; CI doesn't push, comment, or release, so
# read-only is sufficient for everything below.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a flurry of pushes
# doesn't queue up redundant CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (not moving tags) to
# defend against the supply-chain attack class popularised by
# CVE-2025-30066 (`tj-actions/changed-files`, March 2025). Dependabot
# (.github/dependabot.yml) keeps these current.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Mirror pyproject's ``requires-python = ">=3.10,<3.14"``.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # ``aa-version`` selects the Alliance Auth major a job exercises.
        # The lock resolves to AA 5.x (current primary), so the default
        # ``tests`` nox session runs against AA 5 across every Python.
        # AA 4.x backward-compat is verified via the off-lock
        # ``tests_aa4`` session — included on a single Python to keep
        # CI minutes reasonable while still catching regressions.
        aa-version: ["5"]
        include:
          - python-version: "3.12"
            aa-version: "4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run nox -s ${{ matrix.aa-version == '4' && 'tests_aa4' || 'tests' }}

      - name: Upload test coverage
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}-aa${{ matrix.aa-version }}
          path: htmlcov/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run linters (pre-commit)
        run: uv run nox -s lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run mypy + basedpyright
        run: uv run nox -s typecheck

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint, typecheck]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install GNU gettext
        # ``django-admin compilemessages`` shells out to ``msgfmt`` from
        # GNU gettext; ubuntu-latest images don't include it by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Compile message catalogues
        run: uv run nox -s compilemessages

      - name: Build wheel + sdist
        run: uv build

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
