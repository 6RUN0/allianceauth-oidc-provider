name: Release

# Tag-driven release.
#
# Trigger
# -------
# Pushing an annotated tag matching ``v*`` (e.g. ``v0.1.0b1``,
# ``v0.1.0``, ``v1.2.3``) starts a two-stage pipeline:
#
#   build   → ``uv build`` (wheel + sdist). Verifies that the tag and
#             ``__version__`` agree, and that the CHANGELOG has a
#             matching ``## [X.Y.Z]`` section, before producing
#             artefacts. ``msgfmt`` is installed because
#             ``compilemessages`` shells out to it.
#   publish → uploads to PyPI via the trusted-publishing OIDC handshake
#             (no API tokens), generates Sigstore build provenance, then
#             creates the GitHub Release with notes extracted from
#             CHANGELOG.md by tag.
#
# A tag is expected to point at a commit that already passed the full
# CI matrix (main.yml). The release workflow therefore does not re-run
# tests/lint/typecheck — that would only narrow the matrix to a single
# Python and create a false sense of "verified at release time".
#
# Trusted Publishing setup (one-time, on PyPI side)
# -------------------------------------------------
# https://pypi.org/manage/account/publishing/ → Add a new pending
# publisher with these exact values:
#
#   PyPI Project Name : allianceauth-oidc-provider-eveo7
#   Owner             : 6RUN0
#   Repository name   : allianceauth-oidc-provider
#   Workflow filename : release.yml
#   Environment name  : pypi
#
# The repository must also have a GitHub Environment named ``pypi``
# (Settings → Environments). Without these, the publish step fails at
# the OIDC token exchange with ``invalid-publisher``.
#
# Security
# --------
# - All ``run:`` blocks pass ``${{ github.* }}`` values through ``env:``
#   rather than direct ``${{ }}`` interpolation, to avoid shell
#   injection from a maliciously-crafted tag name (cf.
#   https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/).
# - Third-party actions are pinned to commit SHAs (defended against
#   the CVE-2025-30066 supply-chain class). Dependabot
#   (.github/dependabot.yml) keeps them current.

on:
  push:
    # PEP 440 release shape: ``vMAJOR.MINOR.PATCH[suffix]``. The
    # previous ``v*`` accepted ``vendor-X``, ``v-rc`` and other typo
    # tags — they failed downstream in the ``__version__``-vs-tag
    # check, but spinning the workflow up at all for a tag that
    # cannot possibly be a release is wasted runner minutes and
    # adds noise to the Actions UI.
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

# Default to the most-restrictive token. The publish-pypi job
# explicitly grants itself the scopes it actually needs.
permissions:
  contents: read

# Releases must not be cancellable mid-publish — interrupting between
# the OIDC token mint and the actual upload can leave the project in a
# half-published state on PyPI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Local composite actions need the repo on disk first — see
      # ``.github/actions/setup/action.yml`` for the upstream gotcha.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # Release builds MUST NOT consume wheel cache that PR runs
          # populated — that path is a cache-poisoning vector against
          # the signed artefact (zizmor ``cache-poisoning`` audit).
          enable-cache: "false"

      # The release comment header says "A tag is expected to point at
      # a commit that already passed the full CI matrix". Make that an
      # enforced precondition, not an expectation: query the Check Runs
      # API for the tagged SHA and fail the build job if main CI did
      # not complete with conclusion == success.
      - name: Verify main CI is green for the tagged commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const sha = context.sha;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              filter: 'latest',
              per_page: 100,
            });
            const ciChecks = data.check_runs.filter(
              c => c.name === 'test'
                || c.name === 'lint'
                || c.name === 'typecheck'
                || c.name === 'package'
                || c.name.startsWith('test (')
            );
            if (ciChecks.length === 0) {
              core.setFailed(
                `No CI check runs found for ${sha}; refusing to ` +
                `release. Push to a branch first so main.yml runs.`,
              );
              return;
            }
            const failed = ciChecks.filter(
              c => c.status !== 'completed' || c.conclusion !== 'success',
            );
            if (failed.length > 0) {
              const summary = failed
                .map(c => `${c.name}: ${c.status}/${c.conclusion}`)
                .join('; ');
              core.setFailed(
                `CI checks for ${sha} not all green: ${summary}`,
              );
              return;
            }
            core.info(
              `Verified ${ciChecks.length} CI check runs green for ${sha}`,
            );

      - name: Install GNU gettext
        # ``django-admin compilemessages`` shells out to ``msgfmt`` from
        # GNU gettext; ubuntu runner images don't include it by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      # The single most common foot-gun for tag-driven releases is
      # ``git tag v0.1.0`` against a commit whose ``__version__`` still
      # says ``0.0.9``. Catch it before producing artefacts.
      - name: Verify tag matches __version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          ver="$(uv run python -c 'import allianceauth_oidc; print(allianceauth_oidc.__version__)')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ${TAG} does not match __version__ ${ver}"
            exit 1
          fi
          echo "tag and __version__ both report ${ver}"

      # Companion check: a release that lands on PyPI without a
      # corresponding CHANGELOG section is an operator error, not a
      # silent fallback. Fail here, not later in publish-pypi.
      - name: Verify CHANGELOG.md has a section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          if ! awk -v ver="${ver}" '
              $0 ~ "^## \\["ver"\\]" { found = 1 }
              END                     { exit !found }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section [${ver}] for tag ${TAG}"
            exit 1
          fi
          echo "CHANGELOG.md has section [${ver}]"

      - name: Compile message catalogues
        run: uv run nox -s compilemessages

      - name: Build wheel + sdist
        run: uv build

      - name: Emit dependency manifest alongside artefacts (SBOM-lite)
        # Sigstore attestations cover *what was built*; downstream
        # consumers (FedRAMP / SOC 2 pipelines) also want *what's
        # inside*. ``uv export`` snapshots the resolved dep tree in
        # requirements.txt format — a machine-readable inventory that
        # gets attested together with the wheel via the existing
        # ``subject-path: dist/*`` in publish-pypi. Not a full CycloneDX
        # SBOM, but the smallest useful artefact for the cost.
        run: uv export --format requirements-txt --no-hashes --no-emit-project -o dist/requirements.txt

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Bind the publish step to the ``pypi`` GitHub Environment. This
    # both narrows the OIDC subject claim (extra defence-in-depth) and
    # gives a place in repo settings to require manual approval, branch
    # restrictions, etc.
    environment:
      name: pypi
      url: https://pypi.org/project/allianceauth-oidc-provider-eveo7/

    permissions:
      id-token: write          # OIDC token for trusted publishing
      attestations: write      # Sigstore build provenance
      contents: write          # gh release create

    steps:
      # Runtime egress allow-list on the runner. ``id-token: write`` +
      # PyPI trusted publishing makes this job the highest-value
      # target in the workflow stack: a poisoned dep that succeeds in
      # exfiltrating the short-lived OIDC token gets one shot at
      # publishing a malicious wheel. ``harden-runner`` blocks
      # outbound connections to anywhere outside an explicit
      # allow-list. ``audit`` mode is the safe initial posture —
      # observes baseline egress and reports unexpected destinations
      # without failing the job. After a clean release cut, flip to
      # ``egress-policy: block`` with an explicit ``allowed-endpoints``
      # list reflecting the audit-mode findings (PyPI upload host,
      # Sigstore Rekor, etc.).
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863  # v2.12.1
        with:
          egress-policy: audit
          disable-sudo: true

      # Sparse checkout — the publish job only reads CHANGELOG.md to
      # build release notes. Avoids cloning the whole tree just for
      # one file.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download distribution artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Generate Sigstore build provenance attestations
        # PyPI surfaces these on the project page and clients can verify
        # ``pip install`` artefacts against them.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: 'dist/*'

      # ``pypa/gh-action-pypi-publish@v1.9.0`` ships an older twine
      # inside its Docker image which rejects ``Metadata-Version: 2.4``
      # produced by modern flit-core (PEP 685, 2024). The check runs
      # both as a pre-flight (``verify-metadata``) and inside
      # ``twine upload`` itself, so the action is fundamentally broken
      # for current build backends until upstream re-bakes the image.
      #
      # ``uv publish`` is a drop-in replacement: it understands the
      # 2.4 metadata format (uv ↔ flit-core share the spec), supports
      # PyPI Trusted Publishing automatically when ``id-token: write``
      # is granted (auto-detects the GitHub OIDC token via
      # ``ACTIONS_ID_TOKEN_REQUEST_*`` env vars), and avoids the Docker
      # round-trip — uv runs natively on the runner and is already in
      # our toolchain.
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          # See build job: release context MUST NOT read shared cache.
          enable-cache: false

      - name: Publish to PyPI via uv
        run: uv publish dist/*

      - name: Create GitHub Release from CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Extract the section of CHANGELOG.md that matches this tag.
        # ``awk`` walks the file, switches on at the matching
        # ``## [X.Y.Z]`` heading and off at the next top-level
        # ``## […]``. Empty extraction is treated as an operator error
        # — the build job's ``Verify CHANGELOG.md has a section…`` step
        # already fail-fasted, so reaching here with empty notes means
        # the CHANGELOG was edited between build and publish (very
        # unusual). ``--notes-file -`` reads from stdin, which avoids
        # ARG_MAX limits on long notes and any argv quoting hazards
        # that ``--notes "$var"`` exposes.
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          notes="$(awk -v ver="${ver}" '
              $0 ~ "^## \\["ver"\\]"        { p = 1; next }
              p && /^## \[[^]]+\]/          { exit }
              p                              { print }
          ' CHANGELOG.md)"
          if [ -z "${notes}" ]; then
            echo "::error::CHANGELOG section [${ver}] is empty or missing"
            exit 1
          fi
          # Empty awk output also occurs when the CHANGELOG section
          # header matches but the body is blank (e.g. ``## [X.Y.Z]``
          # immediately followed by the next section). A real release
          # always has at least a few lines of content; treat anything
          # shorter as an extraction failure.
          line_count="$(printf '%s\n' "${notes}" | wc -l)"
          if [ "${line_count}" -lt 2 ]; then
            echo "::error::CHANGELOG section [${ver}] body too short (${line_count} line(s)) — extraction likely broken"
            exit 1
          fi
          printf '%s\n' "${notes}" \
            | gh release create "${TAG}" \
                --title "${TAG}" \
                --notes-file - \
                dist/*
