# Apply to all files without committing:
#   uv run pre-commit run --all-files
# Update this file:
#   uv run pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: detect-private-key
        exclude: ^tests/oidc-test\.key$
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            \.po|
            \.mo
          )
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)(
            \.po|
            \.mo
          )

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.0
    hooks:
      - id: editorconfig-checker
        exclude: |
          (?x)(
            LICENSE|
            \.po|
            \.mo
          )

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.7
    hooks:
      - id: docformatter
        args:
          - --wrap-summaries=79
          - --wrap-descriptions=79
          - --pre-summary-newline
          - --close-quotes-on-newline
          - --in-place

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.29.1
    hooks:
      - id: django-upgrade
        args: [--target-version=4.2]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (project venv)
        entry: uv
        language: system
        types_or: [python, pyi]
        args: ["run", "ruff", "check", "--fix", "--show-fixes"]

      - id: ruff-format
        name: ruff format (project venv)
        entry: uv
        language: system
        types_or: [python, pyi]
        args: ["run", "ruff", "format"]

      - id: mypy
        name: mypy (project venv)
        entry: uv
        language: system
        types: [python]
        pass_filenames: false
        args: ["run", "mypy", "--config-file", "pyproject.toml", "allianceauth_oidc"]

      - id: basedpyright
        name: basedpyright (project venv)
        entry: uv
        language: system
        pass_filenames: false
        args: ["run", "basedpyright", "--project", "pyproject.toml"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^allianceauth_oidc/.*\.py$

  # pip-audit is opt-in (stage: manual) because Alliance Auth pins old
  # transitive deps with public CVEs that cannot be upgraded from this repo.
  # Run on demand:
  #   uv run nox -s audit
  #   uv run pre-commit run pip-audit --hook-stage=manual --all-files
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (project venv)
        entry: uv
        language: system
        pass_filenames: false
        stages: [manual]
        files: ^(pyproject\.toml|uv\.lock)$
        args: ["run", "pip-audit"]
