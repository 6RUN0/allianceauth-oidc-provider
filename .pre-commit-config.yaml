# Apply to all files without committing:
#   uv run pre-commit run --all-files
# Update this file:
#   uv run pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: detect-private-key
        # ``tests/oidc-test.key`` is the JWT test key.
        # ``tests/test_command_jwks_rotate.py`` only contains the
        # literal PEM header / footer markers as a presence assert
        # on ``oidc_jwks_rotate`` stdout — no key material.
        exclude: |
          (?x)^(
              tests/oidc-test\.key
            | tests/test_command_jwks_rotate\.py
          )$
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            \.po|
            \.mo
          )
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)(
            \.po|
            \.mo
          )

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.0
    hooks:
      - id: editorconfig-checker
        exclude: |
          (?x)(
            LICENSE|
            \.po|
            \.mo
          )

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  # Typo lint for code, docstrings, comments, log messages, and
  # Markdown. Complements ``vale`` (prose linter for *.md only) and
  # ruff D-codes (docstring *shape*, not spelling). Reads its config
  # from ``[tool.codespell]`` in pyproject.toml via the bundled
  # ``tomli`` dependency. Skips and ignore-words live there so they
  # apply both to pre-commit and to manual ``codespell .`` runs.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]

  # docformatter (1.7.x) hard-codes D212-style normalization and conflicts
  # with our chosen D213 (summary on second line). Docstring shape is now
  # owned by ruff (`extend-select = ["D213"]` in pyproject.toml).
  # Wrap/normalize behaviour we lose: line wrapping at 79 cols and
  # cleanup of stray whitespace inside docstrings — neither is enforced
  # at commit time anymore; flag-set them via a one-off pass if drift
  # accumulates.

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.29.1
    hooks:
      - id: django-upgrade
        args: [--target-version=4.2]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (project venv)
        entry: uv
        language: system
        types_or: [python, pyi]
        args: ["run", "ruff", "check", "--fix", "--show-fixes"]

      - id: ruff-format
        name: ruff format (project venv)
        entry: uv
        language: system
        types_or: [python, pyi]
        args: ["run", "ruff", "format"]

      - id: mypy
        name: mypy (project venv)
        entry: uv
        language: system
        types: [python]
        pass_filenames: false
        args: ["run", "mypy", "--config-file", "pyproject.toml", "allianceauth_oidc"]

      - id: basedpyright
        name: basedpyright (project venv)
        entry: uv
        language: system
        pass_filenames: false
        args: ["run", "basedpyright", "--project", "pyproject.toml"]

      - id: vulture
        name: vulture (dead-code detection)
        entry: uv
        language: system
        pass_filenames: false
        types: [python]
        args: ["run", "vulture"]

      - id: xenon
        name: xenon (cyclomatic complexity)
        entry: uv
        language: system
        pass_filenames: false
        types: [python]
        # Thresholds documented above [tool.vulture] in pyproject.toml.
        # ``--max-absolute C`` caps the most complex function/method at
        # radon rank C (cyclomatic complexity <= 20). D (the prior bar)
        # allowed up to 30 — generous enough that explosively branchy
        # validators could land without surfacing the smell. Tightening
        # to A is blocked by Celery retry handlers in tasks.py and a
        # few rich management-command handlers; C is the best floor
        # achievable without a refactor pass.
        args: [
          "run", "xenon",
          "--max-absolute", "C",
          "--max-modules", "B",
          "--max-average", "A",
          "allianceauth_oidc/",
        ]

  # uv lock drift detection. Runs on every commit that touches
  # pyproject.toml — a forgotten `uv lock` is a common cause of
  # CI-only failures.
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        args: ["lock", "--check"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^allianceauth_oidc/.*\.py$

  # Conventional Commits gate on commit subjects. The project's
  # global rules require ``type(scope): description``; this hook
  # enforces it at write time so a malformed message is caught
  # before the commit lands.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  # Secret scanning. ``detect-private-key`` (above) only flags RSA /
  # SSH keys; this hook catches API tokens, JWT, webhook URLs with
  # embedded credentials, AWS keys, and high-entropy base64 strings.
  # The ``.secrets.baseline`` file records intentional fixtures
  # (the JWT test key under ``tests/oidc-test.key``, the redacted
  # ``hexlify('test')`` literals in test files, etc.) so the scan
  # focuses on new findings only. Regenerate after intentional
  # fixture edits:
  #   uv run --with detect-secrets detect-secrets scan \
  #     --exclude-files '^uv\.lock$|^\.secrets\.baseline$|\.po$|\.mo$' \
  #     > .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)(
            ^uv\.lock$|
            ^\.secrets\.baseline$
          )

  # Dependency hygiene: deptry walks the AST and compares actual
  # imports to ``pyproject.toml::dependencies``. Catches three
  # classes of errors the type-checker cannot:
  #   - DEP001/002: a runtime import not declared in dependencies
  #     (works in dev because AA pulls it transitively, fails in
  #     an isolated wheel).
  #   - DEP003/004: a declared dependency that no code imports
  #     (stale pin from a removed feature).
  #   - DEP005: misplaced dep (production import landing in a
  #     dev-only group).
  # Runs through ``uvx`` so deptry is fetched on demand without
  # polluting the project's dev-group; matches the local-hook
  # pattern used by ruff / mypy / vulture above.
  - repo: local
    hooks:
      - id: deptry
        name: deptry (uvx)
        entry: uvx
        language: system
        pass_filenames: false
        types: [python]
        args: ["deptry", "."]

  # Docstring coverage threshold. The project's ruff config selects
  # the ``D`` rules (missing-docstring per-file enforce/ignore), so
  # individual files are gated. ``interrogate`` measures the overall
  # *percentage* of documented public surface and ``--fail-under``
  # (configured under ``[tool.interrogate]``) turns it into a
  # regression gate.
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        pass_filenames: false
        # Explicit ``allianceauth_oidc`` scope: without a positional
        # path interrogate defaults to ``.`` and walks the env trees
        # (``.nox/``, ``.venv/``) even though the TOML ``exclude``
        # list mentions them — the matcher is a path-prefix, not a
        # regex, and a partial match silently fails for nested
        # site-packages files.
        args: ["--config", "pyproject.toml", "allianceauth_oidc"]

  # pip-audit is opt-in (stage: manual) because Alliance Auth pins old
  # transitive deps with public CVEs that cannot be upgraded from this repo.
  # Run on demand:
  #   uv run nox -s audit
  #   uv run pre-commit run pip-audit --hook-stage=manual --all-files
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (project venv)
        entry: uv
        language: system
        pass_filenames: false
        stages: [manual]
        files: ^(pyproject\.toml|uv\.lock)$
        args: ["run", "pip-audit"]
