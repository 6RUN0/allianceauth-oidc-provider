# Apply to all files without committing:
#   uv run pre-commit run --all-files
# Update this file:
#   uv run pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: detect-private-key
        # ``tests/oidc-test.key`` is the JWT test key.
        # ``tests/test_command_jwks_rotate.py`` only contains the
        # literal PEM header / footer markers as a presence assert
        # on ``oidc_jwks_rotate`` stdout — no key material.
        exclude: |
          (?x)^(
              tests/oidc-test\.key
            | tests/test_command_jwks_rotate\.py
          )$
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            \.po|
            \.mo
          )
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)(
            \.po|
            \.mo
          )
      # Enforce ``test_``-prefixed naming for the test suite. Excludes
      # the shared helpers (``_*.py``, which also covers ``__init__.py``),
      # the Django test wiring (``urls.py`` / ``views.py`` /
      # ``celery.py``), and the whole ``tests/conformance/`` harness — a
      # standalone runner package, not a unittest module set.
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: |
          (?x)(
            ^tests/conformance/|
            ^tests/(.*/)?(_[^/]*|urls|views|celery)\.py$
          )

  # Quick regex gotchas the linters cannot catch:
  # * ``python-check-mock-methods`` — typos like
  #   ``Mock.assret_called_with`` silently pass because ``Mock``
  #   autogenerates any attribute access; a typo = silent green test.
  # * ``python-no-log-warn`` — ``logger.warn`` is deprecated since
  #   Python 3.5; ``logger.warning`` is canonical. ``noxfile.py`` and
  #   ``_nox/`` are excluded because ``nox.Session.warn`` is the tool's
  #   own API, not a logger.
  # * ``python-no-eval`` — defence in depth on top of bandit.
  # * ``text-unicode-replacement-char`` — U+FFFD in source usually
  #   means encoding loss during a paste/migration.
  # * ``python-check-blanket-type-ignore`` — require
  #   ``# type: ignore[code]`` over the blanket form.
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-log-warn
        exclude: ^(noxfile\.py|_nox/)
      - id: python-no-eval
      - id: text-unicode-replacement-char
      - id: python-check-blanket-type-ignore

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.0
    hooks:
      - id: editorconfig-checker
        exclude: |
          (?x)(
            LICENSE|
            \.po|
            \.mo
          )

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  # Style / structural lint for YAML beyond check-yaml's
  # parseability check. Catches duplicate keys (silent merges in
  # GitHub Actions schema), indent drift, mixed quoting,
  # trailing-space rot. Config in ``.yamllint``: extends ``relaxed``
  # + ``line-length: 200`` to accommodate GHA shell pipelines.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]

  # Typo lint for code, docstrings, comments, log messages, and
  # Markdown. Complements ``vale`` (prose linter for *.md only) and
  # ruff D-codes (docstring *shape*, not spelling). Reads its config
  # from ``[tool.codespell]`` in pyproject.toml via the bundled
  # ``tomli`` dependency. Skips and ignore-words live there so they
  # apply both to pre-commit and to manual ``codespell .`` runs.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]

  # Architectural import-graph enforcement. ``tach.toml`` declares
  # three layers (api -> service -> core) and assigns every module
  # in ``allianceauth_oidc/`` to one of them; ``tach check`` fails
  # the commit if a layer imports from a layer above it (e.g.
  # ``security.py`` reaching for ``auth_provider``, which would
  # weaken the 3-layer policy enforcement documented in CLAUDE.md).
  # New modules MUST be added to ``tach.toml`` with an explicit
  # layer — unlisted modules are unconstrained, defeating the
  # purpose of the gate.
  - repo: local
    hooks:
      - id: tach
        name: tach (architectural layers + interfaces)
        entry: uvx
        language: system
        pass_filenames: false
        types: [python]
        files: ^(allianceauth_oidc/.*\.py|tach\.toml)$
        # Bare ``tach check`` validates layer membership only.
        # Without ``--interfaces`` the declarative export contracts
        # in ``tach.toml`` are inert. Explicit both flags so the
        # gate enforces ``[[interfaces]]`` ``expose`` lists too.
        args: ["tach", "check", "--dependencies", "--interfaces"]

  # OIDC-specific Semgrep rules (five patterns). Rules live in
  # ``.semgrep/oidc-security.yaml`` rather than coming from
  # ``semgrep.dev/r/...`` because the community rulesets switched to
  # token-gated downloads (HTTP 401 anonymously); a local config
  # keeps the hook self-contained and avoids adding
  # ``SEMGREP_APP_TOKEN`` plumbing for every contributor.
  # ``--jobs=1`` works around an io_uring resource-allocation crash
  # observed under the eio_linux backend on hosts with constrained
  # io_uring limits.
  - repo: local
    hooks:
      - id: semgrep-oidc
        name: semgrep (OIDC / OAuth2 patterns)
        entry: uvx
        language: system
        pass_filenames: false
        types: [python]
        files: ^allianceauth_oidc/.*\.py$
        args:
          - semgrep
          - --config
          - .semgrep/oidc-security.yaml
          - --metrics=off
          - --error
          - --jobs=1
          - --quiet
          - allianceauth_oidc/

  # docformatter (1.7.x) hard-codes D212-style normalization and conflicts
  # with our chosen D213 (summary on second line). Docstring shape is now
  # owned by ruff (`extend-select = ["D213"]` in pyproject.toml).
  # Wrap/normalize behaviour we lose: line wrapping at 79 cols and
  # cleanup of stray whitespace inside docstrings — neither is enforced
  # at commit time anymore; flag-set them via a one-off pass if drift
  # accumulates.

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.29.1
    hooks:
      - id: django-upgrade
        args: [--target-version=4.2]

  # Django template linting for the operator-facing templates
  # (authorize / denied / logout-confirm). Catches unclosed tags,
  # broken attribute layout, missing block balance, and missing
  # ``alt`` — gaps the Python test base does not cover because the
  # view tests render only a curated fixture set. Config (profile,
  # line caps, ignored stylistic rules) lives in ``[tool.djlint]``.
  - repo: https://github.com/djlint/djLint
    rev: v1.36.1
    hooks:
      - id: djlint-django

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (project venv)
        entry: uv
        language: system
        types_or: [python, pyi]
        args: ["run", "ruff", "check", "--fix", "--show-fixes"]

      - id: ruff-format
        name: ruff format (project venv)
        entry: uv
        language: system
        types_or: [python, pyi]
        args: ["run", "ruff", "format"]

      - id: mypy
        name: mypy (project venv)
        entry: uv
        language: system
        types: [python]
        pass_filenames: false
        args: ["run", "mypy", "--config-file", "pyproject.toml", "allianceauth_oidc"]

      - id: basedpyright
        name: basedpyright (project venv)
        entry: uv
        language: system
        pass_filenames: false
        args: ["run", "basedpyright", "--project", "pyproject.toml"]

      - id: vulture
        name: vulture (dead-code detection)
        entry: uv
        language: system
        pass_filenames: false
        types: [python]
        args: ["run", "vulture"]

      - id: xenon
        name: xenon (cyclomatic complexity)
        entry: uv
        language: system
        pass_filenames: false
        types: [python]
        # Thresholds documented above [tool.vulture] in pyproject.toml.
        # ``--max-absolute C`` caps the most complex function/method at
        # radon rank C (cyclomatic complexity <= 20). D (the prior bar)
        # allowed up to 30 — generous enough that explosively branchy
        # validators could land without surfacing the smell. Tightening
        # to A is blocked by Celery retry handlers in tasks.py and a
        # few rich management-command handlers; C is the best floor
        # achievable without a refactor pass.
        args: [
          "run", "xenon",
          "--max-absolute", "C",
          "--max-modules", "B",
          "--max-average", "A",
          "allianceauth_oidc/",
        ]

  # uv lock drift detection. Runs on every commit that touches
  # pyproject.toml — a forgotten `uv lock` is a common cause of
  # CI-only failures.
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        args: ["lock", "--check"]

  # Generated-Makefile drift detection. The Makefile is rendered from
  # the ``TARGETS`` table in ``_nox/makefile.py``; this gate runs the
  # three drift checks (content matches the render, every nox session
  # has a target, no target names a dead session). Triggers on the
  # Makefile, its generator / template, and any ``_nox`` / ``noxfile``
  # change that could add or rename a session. See ``makefile_check``
  # in noxfile.py.
  - repo: local
    hooks:
      - id: makefile-check
        name: makefile (generated; sync with nox sessions)
        entry: uv
        language: system
        pass_filenames: false
        files: ^(Makefile|noxfile\.py|_nox/.*\.py|_nox/Makefile\.tmpl)$
        args: ["run", "nox", "-s", "makefile_check"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^allianceauth_oidc/.*\.py$
      # Bandit on test code at HIGH severity only — test fixtures
      # (``_jwt_helpers.py``, ``alg=none`` builders) regularly use
      # patterns bandit flags at lower severities by design. Scoping
      # to high catches genuinely dangerous primitives that should
      # never appear in test code; baseline is clean as of
      # 2026-05-20, so the gate is enforced (not advisory).
      - id: bandit
        name: bandit (tests, high severity only)
        args: ["-c", "pyproject.toml", "--severity-level=high"]
        additional_dependencies: ["bandit[toml]"]
        files: ^tests/.*\.py$

  # Conventional Commits gate on commit subjects. The project's
  # global rules require ``type(scope): description``; this hook
  # enforces it at write time so a malformed message is caught
  # before the commit lands.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  # Secret scanning. ``detect-private-key`` (above) only flags RSA /
  # SSH keys; this hook catches API tokens, JWT, webhook URLs with
  # embedded credentials, AWS keys, and high-entropy base64 strings.
  # The ``.secrets.baseline`` file records intentional fixtures
  # (the JWT test key under ``tests/oidc-test.key``, the redacted
  # ``hexlify('test')`` literals in test files, etc.) so the scan
  # focuses on new findings only. Regenerate after intentional
  # fixture edits:
  #   uv run --with detect-secrets detect-secrets scan \
  #     --exclude-files '^uv\.lock$|^\.secrets\.baseline$|\.po$|\.mo$' \
  #     > .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)(
            ^uv\.lock$|
            ^\.secrets\.baseline$
          )

  # Dependency hygiene: deptry walks the AST and compares actual
  # imports to ``pyproject.toml::dependencies``. Catches three
  # classes of errors the type-checker cannot:
  #   - DEP001/002: a runtime import not declared in dependencies
  #     (works in dev because AA pulls it transitively, fails in
  #     an isolated wheel).
  #   - DEP003/004: a declared dependency that no code imports
  #     (stale pin from a removed feature).
  #   - DEP005: misplaced dep (production import landing in a
  #     dev-only group).
  # Runs through ``uvx`` so deptry is fetched on demand without
  # polluting the project's dev-group; matches the local-hook
  # pattern used by ruff / mypy / vulture above.
  - repo: local
    hooks:
      - id: deptry
        name: deptry (uvx)
        entry: uvx
        language: system
        pass_filenames: false
        types: [python]
        args: ["deptry", "."]

  # Test-suite hygiene gate. Encodes conventions surfaced by the
  # 4-agent test review and closed across the existing call sites by
  # the test-suite refactor batch (commits ``2cc1a8e`` / ``953be80``
  # / ``cbf27e0`` / ``f69cc53`` / ``dce24b2``). The gate keeps the
  # duplication from reappearing in new test files. Rules live in
  # ``scripts/check_test_conventions.sh`` rather than inline YAML so
  # the bash bodies don't collide with YAML's mapping-colon parsing,
  # and so new rules can be added without touching this file.
  - repo: local
    hooks:
      - id: check-test-conventions
        name: test-suite hygiene (forbid drift back to raw json.loads / …)
        entry: scripts/check_test_conventions.sh
        language: system
        types: [python]
        files: ^tests/test_.*\.py$

  # Docstring coverage threshold. The project's ruff config selects
  # the ``D`` rules (missing-docstring per-file enforce/ignore), so
  # individual files are gated. ``interrogate`` measures the overall
  # *percentage* of documented public surface and ``--fail-under``
  # (configured under ``[tool.interrogate]``) turns it into a
  # regression gate.
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        pass_filenames: false
        # Explicit ``allianceauth_oidc`` scope: without a positional
        # path interrogate defaults to ``.`` and walks the env trees
        # (``.nox/``, ``.venv/``) even though the TOML ``exclude``
        # list mentions them — the matcher is a path-prefix, not a
        # regex, and a partial match silently fails for nested
        # site-packages files.
        args: ["--config", "pyproject.toml", "allianceauth_oidc"]

  # pip-audit is opt-in (stage: manual) because Alliance Auth pins old
  # transitive deps with public CVEs that cannot be upgraded from this repo.
  # Run on demand:
  #   uv run nox -s audit
  #   uv run pre-commit run pip-audit --hook-stage=manual --all-files
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (project venv)
        entry: uv
        language: system
        pass_filenames: false
        stages: [manual]
        files: ^(pyproject\.toml|uv\.lock)$
        args: ["run", "pip-audit"]
