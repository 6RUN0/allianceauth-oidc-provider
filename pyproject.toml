[build-system]
build-backend = "uv_build"
requires = [ "uv_build>=0.5,<0.20" ]

[project]
name = "allianceauth-oidc-provider-eveo7"
version = "0.4.1"
description = "OpenID Connect / OAuth2 provider for Alliance Auth, layered on django-oauth-toolkit."
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "AaronKable", email = "aaronkable@gmail.com" } ]
maintainers = [ { name = "Boris Talovikov", email = "boris.t.66@gmail.com" } ]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# No `dynamic = [...]` field. ``version`` and ``description`` are static
# here (single source of truth — pyproject.toml). Runtime access to
# ``__version__`` goes through ``importlib.metadata.version`` in
# ``allianceauth_oidc/__init__.py`` so the value never drifts from the
# wheel that's actually deployed.

dependencies = [ "allianceauth>=4,<6", "django-oauth-toolkit>=3.2,<4" ]

# Optional extras. ``metrics`` opts the operator into Prometheus
# integration via ``django-prometheus``: when installed (whether
# through this extra or pulled in by another AA module) our
# ``_metrics`` module starts emitting counters/histograms/gauges
# into the default Prometheus REGISTRY, and django-prometheus'
# /metrics endpoint exports them alongside its own HTTP metrics.
# Without it, every metric call resolves to a no-op stub at
# near-zero runtime cost — see ``allianceauth_oidc/_metrics.py``.
optional-dependencies.metrics = [ "django-prometheus>=2.3" ]

urls.Homepage = "https://github.com/6RUN0/allianceauth-oidc-provider"
urls.Source = "https://github.com/6RUN0/allianceauth-oidc-provider"
urls.Tracker = "https://github.com/6RUN0/allianceauth-oidc-provider/issues"
urls.Upstream = "https://github.com/Solar-Helix-Independent-Transport/allianceauth-oidc-provider"

# AA-stack dependency groups (PEP 735). Each group narrows the
# top-level ``allianceauth>=4,<6`` contract to a single major line so
# the matrix sessions in ``noxfile.py`` (``tests_aa4``, future
# ``tests_aaN``) can pin a stack via ``uv pip install -e . --group aaN``
# instead of hard-coding constraints in the session body. The default
# ``tests`` / ``tests_matrix`` sessions stay lock-driven (which today
# resolves to AA 5.x); the explicit ``aa5`` group exists for symmetry
# and lets ``uv tree --group aa5`` enumerate the AA 5.x dependency tree
# without consulting the lock.
[dependency-groups]
aa4 = [
    "allianceauth>=4,<5",
    "django<5",
]
aa5 = [
    "allianceauth>=5,<6",
    "django>=5.2,<6",
]
dev = [
    "bandit[toml]>=1.9",
    "coverage>=7.6",
    # cosmic-ray (mutation testing). Chosen over mutmut 2.x because the
    # latter's Pony-ORM result cache is incompatible with Python 3.13's
    # tightened iterator protocol (no upstream fix), and mutmut 3.x is
    # pytest-only which would force a parallel ``pytest-django``
    # toolchain. cosmic-ray uses sqlite for its work-queue, supports
    # any test runner via subprocess exit code (the Django runner here
    # is plugged in via ``cosmic-ray.toml::test-command``), and is
    # actively maintained.
    "cosmic-ray>=8.3",
    # Tests exercise the real ``prometheus_client.Counter`` /
    # ``Histogram`` / ``Gauge`` paths under the assumption that
    # operators who care about observability will install the
    # ``[metrics]`` extra. A dedicated smoke test
    # (``tests/test_metrics.py::TestMetricsNoOpWithoutDjangoPrometheus``)
    # patches ``sys.modules`` to exercise the fallback path so the
    # no-op contract stays covered even when the dep is present.
    "django-prometheus>=2.3",
    "django-stubs>=5.2.9",
    "docformatter>=1.7",
    "fakeredis>=2.33",
    # Property-based testing for cryptographic invariants:
    # PKCE code_verifier -> code_challenge round-trip, scope -> claim
    # mapping monotonicity, state/nonce passthrough. Hypothesis
    # generates structured random inputs from a strategy and shrinks
    # to a minimal failing case. Failing examples are cached under
    # ``.hypothesis/`` (gitignored) so a regression replays the exact
    # input that broke without re-rolling.
    "hypothesis>=6.118",
    "mypy>=1.19",
    # MariaDB/MySQL integration-test backend, opt-in via the
    # ``AA_OIDC_TEST_DB`` env gate (see ``tests/_mariadb_container.py`` and
    # the ``tests_mariadb`` session). ``mysqlclient`` is the DB driver the
    # test process connects through; it builds against the libmariadb /
    # libmysqlclient headers (``mariadb_config`` / ``mysql_config`` on
    # PATH), which CI provisions with ``default-libmysqlclient-dev``.
    "mysqlclient>=2.2",
    "nox>=2026.2.9",
    "parameterized>=0.9",
    "pip-audit>=2.10",
    "basedpyright>=1.31",
    "pre-commit>=4.5.1",
    "requests>=2.32",
    "ruff>=0.15",
    # Throwaway MariaDB for the ``tests_mariadb`` session: ``testcontainers``
    # starts a disposable server in the nox-session (parent) process and
    # the session exports its connection params as ``AA_OIDC_TEST_DB_*``.
    # Needs a running Docker daemon; the gate degrades to a skip when one
    # is absent so the default suite never depends on it.
    "testcontainers[mysql]>=4.8",
    # Dead-code detector. Complements ruff F401 (unused imports) by also
    # finding unused functions, classes, and class attributes. ``min_confidence``
    # and Django ignore_names live in [tool.vulture].
    "vulture>=2.16",
    # Cyclomatic-complexity guard. Pre-commit thresholds documented in
    # [tool.vulture] adjacent comments — xenon has no pyproject.toml schema.
    "xenon>=0.9",
]

[tool.uv]
# AA-stack groups (``aa4`` / ``aa5``) are mutually exclusive — they
# pin Django to non-overlapping ranges (``<5`` vs ``>=5.2``). PEP 735
# dependency groups by default all participate in a single lock
# resolution; without this conflict declaration ``uv lock`` (and the
# ``uv lock --check`` pre-commit hook) would fail with
# "your project's requirements are unsatisfiable". Declaring the pair
# as conflicting tells uv to lock each group independently.
conflicts = [
    [{ group = "aa4" }, { group = "aa5" }],
]

[tool.uv.build-backend]
# Flat layout: the importable module ``allianceauth_oidc`` sits at
# the repo root, not under ``src/``. Default uv-build module-name
# normalization would derive ``allianceauth_oidc_provider_eveo7``
# from the project name; ``module-name`` here pins the actual
# importable name back to the historical ``allianceauth_oidc``.
module-root = ""
module-name = "allianceauth_oidc"

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = [ ".tox", ".venv", "htmlcov", "dist", "build" ]

[tool.ruff.lint]
select = [
    # Baseline (PEP-8 + pyflakes + isort + bugbear + modernization
    # + naming + simplifier + comprehensions + comprehension-anti-patterns
    # + ruff-specifics + pydocstyle).
    "E", "F", "I", "B", "UP", "N", "SIM", "C4", "PIE", "RUF", "D",
    # Layer 2 hardening — Django/logging/exception/path/type-checking
    # patterns. Each group below was added after audit and lints clean
    # against the current code:
    "DJ",   # flake8-django (NullField, missing __str__, Meta ordering)
    "LOG",  # flake8-logging (e.g. logger.exception placement)
    "G",    # flake8-logging-format (no f-string in log args — kills lazy-formatting safe-logging contract)
    "RET",  # flake8-return (unnecessary else-after-return etc.)
    "DTZ",  # flake8-datetimez (naive datetime in a tz-aware Django app)
    "ISC",  # flake8-implicit-str-concat (bug-prone "..." "..." adjacency)
    "BLE",  # flake8-blind-except (no `except Exception` without re-raise)
    "PTH",  # flake8-use-pathlib (os.path → Path)
    "TC",   # flake8-type-checking (typing-only imports under TYPE_CHECKING)
    "TID",  # flake8-tidy-imports (banned/relative imports policy)
    # Layer 3 hardening — language-level patterns:
    "A",    # flake8-builtins (no shadowing ``id`` / ``type`` / ``list`` etc.)
    "FURB", # refurb (modernization patterns complementary to UP)
    "TRY",  # tryceratops (exception-handling anti-patterns)
    "PERF", # perflint (try/except in loop, dict.keys()-in-check, etc.)
    "SLF",  # flake8-self (private-member access from outside class)
    "ICN",  # flake8-import-conventions (canonical aliases for libs)
    "PGH",  # pygrep-hooks (blanket-noqa, eval-used safety)
    # Layer 4 hardening — pylint port + Django framework escape hatches:
    "ARG",  # flake8-unused-arguments (Django hooks need per-file carve-outs)
    "PLE",  # pylint errors (genuine bugs)
    "PLW",  # pylint warnings (suspect patterns)
    "PLC",  # pylint conventions
    "PLR",  # pylint refactors (complexity / too-many-X)
    # Layer 5 — eradicate: forbids commented-out code (rotates into
    # stale comment debt). Global rule in ~/.claude/CLAUDE.md
    # explicitly forbids the pattern — this rule makes it enforceable.
    "ERA",
]
# D213 (multi-line summary on second line) is the project's chosen
# docstring shape. It is mutually exclusive with D212 (summary on the
# first line), which the pep257 convention enables — so we explicitly
# extend-select D213 and ignore D212.
extend-select = [ "D213" ]
ignore = [
    "B008",    # function-call-in-default-argument — common in Django (e.g. timezone.now)
    "D205",    # docformatter and D205 disagree on blank line after summary
    "D212",    # we use D213 (summary on second line); see extend-select above
    "D401",    # imperative mood is subjective for descriptive helpers
    "TRY003",  # long ``raise ValueError(...)`` messages are idiomatic in CLI / Django code; a custom exception class per validation site is over-engineering
    "PLC0415", # function-local imports are intentional: AA-core has heavy import-time side effects, so we lazy-import inside ``ready()`` hooks, signal handlers, and management commands
]

[tool.ruff.lint.flake8-self]
# Django ``Model._meta`` is documented public API despite the leading
# underscore (historical reasons predating ``__dunder__`` as the
# convention for "framework-internal but stable"). Without this
# carve-out, every ``app._meta.app_label`` / ``model._meta.fields``
# access fires SLF001.
extend-ignore-names = [ "_meta" ]

[tool.ruff.lint.pylint]
# ``run_plan`` (conformance orchestrator) carries 11 keyword-only
# arguments — every CLI flag the runner accepts. Splitting it into a
# config dataclass would be over-engineering for a single call site;
# raising ``max-args`` to 13 keeps the genuinely-narrow functions
# checked while accommodating documented config-heavy entry points
# (incl. ``tests/_factories.make_app`` whose 13th kwarg —
# ``backchannel_logout_uri`` — landed with OIDC BCL 1.0).
max-args = 13

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# D100-D107 are missing-docstring rules; the per-file blocks below opt out
# for code where docstrings would be boilerplate (tests, migrations, Django
# nested Meta classes).
[tool.ruff.lint.per-file-ignores]
# Per-file-ignores accumulate across matching globs (NOT override) — a
# narrower block sees the union of its codes plus every parent glob's
# codes. Codes are sorted alphabetically within each list for readable
# diffs when the set evolves.
#
# Django migrations are auto-generated; class attrs intentionally use literal
# lists/dicts (RUF012), operations are long lines (E501), and migration
# modules carry no docstring. ``D107`` (missing __init__ docstring) is not
# applicable: the auto-generated ``Migration`` class has no ``__init__``.
# ``ARG001``: ``RunPython(forwards, reverse)`` callbacks have signature
# ``(apps, schema_editor)`` per Django's contract — ``schema_editor`` is
# required even when the body only touches the apps registry.
"allianceauth_oidc/migrations/*" = [
    "ARG001",
    "D100", "D101", "D102", "D103", "D104", "D106",
    "E501", "N806", "RUF012",
]
# Django ModelAdmin and Model.Meta use class-level mutable attributes by
# design (admin lists, Meta.permissions, etc.) and the nested Meta class
# is a Django convention without docstring. ``N806`` allows the Django
# idiom ``User = get_user_model()`` inside helper methods.
"allianceauth_oidc/admin.py" = [ "D106", "RUF012" ]
"allianceauth_oidc/models.py" = [ "D106", "N806", "RUF012" ]
# Django ``setting_changed`` signal handler must accept
# ``(sender, **kwargs)`` per the dispatcher contract; the body only
# branches on ``setting`` extracted from ``kwargs``.
"allianceauth_oidc/app_settings.py" = [ "ARG001" ]
# Django signal handler contract: receivers accept
# ``(sender, **kwargs)`` plus app-specific positional args. The body
# branches on ``token`` only.
"allianceauth_oidc/signals.py" = [ "ARG001" ]
# oauthlib ``RequestValidator`` parent dictates the signature of
# ``validate_silent_login(self, request)`` and similar; our overrides
# accept the parameter even when policy decisions don't read it.
# ``N806`` allows the Django idiom ``AccessToken = get_access_token_model()``
# inside the validator helpers — mirrors the existing exemption on
# ``models.py`` for the same upstream pattern.
"allianceauth_oidc/auth_provider.py" = [ "ARG002", "N806" ]
# OIDC Back-Channel Logout module: Django signal handlers accept
# ``(sender, instance, **kwargs)`` — kwargs are required by the
# dispatcher even when the body branches on the named args (ARG001).
# ``User = get_user_model()``, ``RefreshToken = ...`` etc. follow the
# Django PascalCase-for-models convention (N806). HTTP status codes
# 200/300/400/500 are well-known well beyond what a ``HTTP_OK``
# constant would clarify (PLR2004). The dispatcher catches blind
# ``Exception`` on key-resolution / broker errors because the failure
# is logged-and-degraded by design (BLE001). ``instance._allianceauth
# _oidc_was_active`` is the documented pre-save snapshot (SLF001).
"allianceauth_oidc/receivers.py" = [
    "ARG001", "BLE001", "N806", "PLR2004", "SLF001",
]
"allianceauth_oidc/logout.py" = [
    "ARG001", "BLE001", "N806", "PLR2004", "SLF001",
]
"allianceauth_oidc/tasks.py" = [
    "ARG001", "BLE001", "N806", "PLR2004",
]
# ``allianceauth_oidc.E001`` Django system check accepts the
# framework-required ``app_configs`` parameter even though it queries
# the global app registry. ``Application = apps.get_model(...)`` is
# the Django idiom (N806); the broad-except around the bootstrap
# DB query is by design — pre-migrate ``manage.py check`` would
# crash otherwise (BLE001).
"allianceauth_oidc/checks.py" = [ "ARG001", "BLE001", "N806" ]
# Django ``View.post(self, request, *args, **kwargs)`` framework
# signature is dispatched via ``method_decorator``; the override must
# preserve ``*args, **kwargs`` even when the body ignores them. The
# ``views*`` glob covers the re-export shim plus the per-endpoint
# siblings (``views_token`` / ``views_authorize`` / ``views_discovery``).
"allianceauth_oidc/views*.py" = [ "ARG002" ]
# Management commands: ``Foo = get_foo_model()`` returns a class, and
# Django convention is to bind it to a PascalCase local — N806 would
# flag every such call site. ``add_arguments`` / ``handle`` are
# framework hooks whose contract is documented on ``BaseCommand``,
# not on each subclass — D102 docstring requirements there are noise.
"allianceauth_oidc/management/commands/*" = [ "D102", "N806" ]
# Test docstrings and assertions are routinely long; custom ``assertXxx``
# methods follow unittest.TestCase's camelCase convention (N802). Test
# helpers commonly bind ``Foo = get_foo_model()`` (N806). The full
# D100-D107 family is opted out because a test method's name is its
# primary documentation — boilerplate single-line docstrings on every
# ``test_xxx`` would dilute the rare ones that carry real intent.
# ``SLF001``: tests legitimately exercise leading-underscore helpers
# (``_enforce_policy``, ``_body_byte_length``) — those names are the
# documented unit-test seam, just kept under-scored to discourage
# external imports from production code.
# ``ARG001/ARG002/ARG005``: Django signal-handler / view / fakeredis
# stubs must accept the framework-required parameters (sender, request,
# alias, kwargs) even when the test body branches on only one of them.
# ``PLR2004``: HTTP status codes (200/302) are well-known constants —
# pulling them into named locals dilutes test readability.
"tests/*" = [
    "ARG001", "ARG002", "ARG005",
    "D100", "D101", "D102", "D103", "D104", "D106", "D107",
    "E501", "N802", "N806", "PLR2004", "SLF001",
]
# ``tests/*`` glob already grants ``E501 N802 N806 D100-D107`` to this
# file (per-file-ignores accumulate, not override) — only ``N999``
# (legacy uppercase ``AA4`` suffix in the module name) is genuinely
# file-specific.
"tests/test_settingsAA4.py" = [ "N999" ]

[tool.ruff.lint.isort]
known-first-party = [ "allianceauth_oidc" ]

[tool.mypy]
python_version = "3.10"
plugins = [ "mypy_django_plugin.main" ]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
# Strict-mode incremental ramp: each flag below was a deliberate
# add-on after baseline plus django-stubs plugin landed. Together
# they raise the floor without requiring code edits — if a future
# refactor regresses (e.g. an unreachable branch, a stale
# ``# type: ignore``, an implicit ``None`` return), the
# typecheck session fails it.
check_untyped_defs = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true
# 2026-05 strict-mode step: closes the four ``disallow_*`` gaps that
# remained after the initial ramp. Each one rejects a class of
# silent ``Any`` ingress:
# * ``disallow_untyped_defs`` — function with no signature annotations
#   (returns ``Any`` implicitly).
# * ``disallow_incomplete_defs`` — partial annotations (some args
#   typed, others not).
# * ``disallow_untyped_decorators`` — a decorator whose return type
#   is unknown silently strips signatures from wrapped functions.
# * ``disallow_any_generics`` — bare ``list`` / ``dict`` / ``set``
#   without type parameters (each leaks ``Any`` into call sites).
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "unused-awaitable",
    "explicit-override",
]
# Type-check production code only. Django dynamic attrs (User.profile,
# setUpTestData ClassVars) need allianceauth-stubs which don't exist.
exclude = [
    "allianceauth_oidc/migrations/.*",
    "tests/.*",
    "build/.*",
    "dist/.*",
]

[tool.django-stubs]
# django-stubs plugin needs a settings module to resolve runtime
# attributes (``settings.X`` lookups, the active user model, etc.).
# We point at the test settings — that's the only canonical
# Django wiring we ship; production deployments configure their
# own settings on top of Alliance Auth's.
django_settings_module = "tests.test_settingsAA4"
strict_settings = false

[[tool.mypy.overrides]]
module = [
    "allianceauth.*",
    "oauth2_provider.*",
    "oauthlib.*",
    "celery.*",
    "aa_skip_email.*",
    "requests",
    "requests.*",
    # ``django_prometheus`` ships without ``py.typed`` and no
    # third-party stub package is published. We import it once in
    # ``_metrics.py`` purely for the side effect of confirming
    # availability (the optional ``[metrics]`` extra gate); the
    # API surface we touch is exactly zero, so suppressing the
    # missing-import error does not weaken type coverage.
    "django_prometheus",
    "django_prometheus.*",
]
ignore_missing_imports = true

# Django ORM fields can't be inferred without django-stubs[compatible-mypy].
# Pyright handles these correctly through its own Django heuristics.
[[tool.mypy.overrides]]
module = [ "allianceauth_oidc.models" ]
disable_error_code = [ "var-annotated" ]

# super().dispatch() in DOT's AuthorizationView is untyped; the return
# type is correct at runtime (HttpResponseBase) but mypy sees it as
# Any. Listed explicitly because mypy requires fully-qualified module
# names (only whole-component wildcards are allowed — ``views*`` is
# rejected).
[[tool.mypy.overrides]]
module = [
    "allianceauth_oidc.views",
    "allianceauth_oidc.views_token",
    "allianceauth_oidc.views_authorize",
    "allianceauth_oidc.views_discovery",
    "allianceauth_oidc.views_userinfo",
]
disable_error_code = [ "no-any-return" ]

# Framework-bound modules where ``disallow_untyped_defs`` would
# require annotating signatures whose shape is dictated by an
# upstream untyped class:
# * ``auth_provider`` — every ``validate_*`` / ``save_*`` /
#   ``get_*`` method overrides an oauthlib ``RequestValidator``
#   method whose parameters are typed as bare ``Any`` (the class
#   ships no ``py.typed`` marker and no third-party stub package
#   covers it).
# * ``tasks`` — Celery's ``@shared_task`` decorator returns an
#   untyped callable in celery 5.x; annotating around it requires
#   ``cast`` gymnastics that obscure the task body.
# * ``admin`` — Django's ``ModelAdmin`` callbacks
#   (``list_display`` callables, ``get_readonly_fields``, etc.)
#   are typed loosely by django-stubs (``Any``-leaky) and the
#   generic type parameter (``ModelAdmin[Model]``) leaks into the
#   admin module without buying real safety.
[[tool.mypy.overrides]]
module = [
    "allianceauth_oidc.auth_provider",
    "allianceauth_oidc.tasks",
    "allianceauth_oidc.admin",
]
disable_error_code = [
    "no-untyped-def",
    "untyped-decorator",
    "type-arg",
]

[tool.basedpyright]
venv = ".venv"
venvPath = "."
include = [ "allianceauth_oidc" ]
exclude = [
    "allianceauth_oidc/migrations",
    "tests",
    "**/__pycache__",
]
reportMissingTypeStubs = "none"
# AllianceAuthApplication.Meta intentionally overrides AbstractApplication.Meta
# to add permissions; oauth2_provider's stub doesn't model this as covariant.
reportIncompatibleVariableOverride = "none"
# basedpyright defaults are stricter than pyright; the Django/oauth2_provider
# integration relies on dynamic attrs that no third-party stub exposes.
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportImplicitOverride = "none"
reportUntypedFunctionDecorator = "none"
reportUnusedCallResult = "none"
# Django ClassView/ModelAdmin idioms.
reportMissingTypeArgument = "none"
reportUnusedParameter = "none"
reportUnannotatedClassAttribute = "none"
# ``logout.py`` and ``tasks.py`` deliberately import each other
# inside function scope: the dispatcher's ``transaction.on_commit``
# callback queues a Celery task whose handler in turn re-imports the
# JWT builder. Pulling the primitive into a third module just to
# silence the static analyzer would add a layer with no callers.
reportImportCycles = "none"
# Implicit string concatenation across line breaks ("a" "b") is the
# idiomatic Django way to wrap long ``gettext`` strings while keeping
# them xgettext-extractable; the rule fires on lines that already
# carry a documented ``noqa: E501`` for the long-line case, which
# leaves no clean way to express both.
reportImplicitStringConcatenation = "none"

[tool.bandit]
# Test files contain intentional anti-patterns (e.g. hardcoded test secrets).
# They are inline-suppressed with `# nosec` where needed; this just trims the
# scan to the production code.
exclude_dirs = [ "tests", "allianceauth_oidc/migrations" ]

# cosmic-ray (mutation testing) configuration lives in ``cosmic-ray.toml``
# at the repo root rather than under ``[tool.cosmic-ray]`` here —
# cosmic-ray's CLI takes the config file as a positional argument and
# the upstream examples uniformly use a dedicated file. See
# ``docs/mutation-testing.md`` for run instructions and the
# ``cosmic-ray.toml`` inline comments for scope rationale.

# xenon (cyclomatic complexity guard) — invoked from pre-commit / nox /
# CI as: ``xenon --max-absolute D --max-modules B --max-average A
# allianceauth_oidc/``. Xenon has no pyproject.toml schema, so the
# thresholds live as inline doc:
# - max-absolute D (≤ 30 per block): per-function ceiling. Catches a
#   single explosively-complex helper (e.g. an authorize-view dispatch
#   that grew an extra 8-branch state machine on top of the existing
#   policy gate) before it lands.
# - max-modules B (≤ 10 module average): every module stays
#   well-structured even if it carries one complex function.
# - max-average A (≤ 5 overall): keeps the codebase as a whole simple.
# Adding a function with complexity > 30 or letting a module's average
# drift past 10 is a regression that pre-commit will catch.

[tool.codespell]
# Skip artefacts and binary/locale files. ``mutation.sqlite`` plus
# its timestamped backups can grow large and contain mutated source
# fragments that look like typos out of context.
skip = ".git,.venv,.nox,uv.lock,.secrets.baseline,tests/oidc-test.key,htmlcov,build,dist,*.po,*.mo,*.pyc,*/__pycache__/*,mutation.sqlite*"
# Ignored words live in an external file so the rationale can be
# documented next to each entry (per-entry comments are not allowed
# in the inline TOML string). New ignores: append to the file with
# a one-line reason in its header section.
ignore-words = ".codespell-ignore.txt"

[tool.djlint]
# Django template profile for the operator-facing templates. The
# ``max_line_length`` (120) matches the Markdown convention, separate
# from the Python line length (79) because HTML attributes inflate
# horizontal use more than Python statements do.
profile = "django"
max_line_length = 120
max_attribute_length = 120
max_blank_lines = 1
# Stylistic rules excluded so the hook focuses on structural template
# defects (unclosed tags, broken attribute lines, bad block balance,
# missing ``alt``). These three render identically across the chosen
# alternatives — they are taste, not correctness:
# * T002 — single vs double quotes inside ``{% tag '…' %}``.
# * T003 — named ``{% endblock body %}`` vs bare ``{% endblock %}``.
# * H023 — HTML entity refs (``&mdash;``) vs the Unicode codepoints.
ignore = "T002,T003,H023"

[tool.deptry]
# Tests + nox + migrations import dev / framework things that production
# code does not — exclude them from the production-import scan.
extend_exclude = [
    "tests",
    "_nox",
    "noxfile\\.py",
    "allianceauth_oidc/migrations",
]

# Import-name → distribution-name overrides. ``django-oauth-toolkit``
# installs the ``oauth2_provider`` package, not ``django_oauth_toolkit``;
# without this hint deptry can't link the declared dependency to the
# import sites and falsely raises DEP002 (declared-but-unused).
[tool.deptry.package_module_name_map]
django-oauth-toolkit = "oauth2_provider"

# Frameworks pulled in transitively by ``allianceauth`` and
# ``django-oauth-toolkit`` (the plugin never pins them directly to
# avoid drift from whatever the upstream constraint resolves to):
#   - DEP001 (missing): we import these without declaring them. AA's
#     dep graph is the single source of truth — pinning them here
#     would risk a version skew against whatever the host AA install
#     actually ships.
#   - DEP004 (dev-only declared): ``requests`` lives in the ``dev``
#     group for HTTP fixtures, but ``tasks.py`` / ``logout.py``
#     legitimately import it in production (AA pulls it transitively
#     via ``esi-py``). Declaring it as a direct prod dep would
#     duplicate the constraint.
#   - ``aa_skip_email`` is a runtime-optional AA extension probed via
#     ``import aa_skip_email`` inside a defensive ``try`` block — by
#     design absent in most deployments.
[tool.deptry.per_rule_ignores]
DEP001 = [
    "django",
    "celery",
    "asgiref",
    "oauth2_provider",
    "oauthlib",
    "jwcrypto",
    "cryptography",
    "prometheus_client",
    "typing_extensions",
    "aa_skip_email",
]
DEP004 = ["requests"]

[tool.interrogate]
# Threshold reflects current baseline (86.4% as of 2026-05-20). The
# 84 floor turns this hook into a no-regression gate while leaving
# ~2% headroom so a single new helper without a docstring does not
# break the build. Lift it 5% at a time once a refactor pushes the
# headroom up — mirrors the ``aa_discord_audit`` strategy.
fail-under = 84
# Coverage scope: production code only. Tests, migrations (Django-
# generated), and the per-package ``__init__.py`` carry their own
# rules (or no rules) under ruff D-codes already.
ignore-init-module = true
ignore-init-method = true
ignore-magic = true  # __repr__ / __str__ are covered by ruff D105
ignore-nested-functions = true
ignore-private = true  # underscore-prefixed helpers
ignore-property-decorators = true  # property docstrings duplicate getter name
ignore-semiprivate = false
ignore-setters = true
exclude = [
    # Direct path-prefix excludes for the rare manual invocation
    # (``uv run --with interrogate interrogate --config pyproject.toml``).
    # Pre-commit passes ``allianceauth_oidc`` as a positional path so
    # these never trigger via the hook — they exist as a safety net.
    ".nox",
    ".venv",
    "htmlcov",
    "docs",
    "tests",
    "_nox",
    "noxfile.py",
    "allianceauth_oidc/migrations",
    "allianceauth_oidc/admin.py",  # ModelAdmin docstrings are framework-shape
    "allianceauth_oidc/apps.py",
]
quiet = false
verbose = 0
omit-covered-files = true

[tool.vulture]
# 80% strikes the right balance for this codebase: 60% drowns in Django
# framework boilerplate (ModelAdmin attrs, has_*_permission hooks); 100%
# misses anything ruff isn't already catching. 80% surfaces only items
# vulture is highly sure are unused.
min_confidence = 80
paths = [ "allianceauth_oidc" ]
exclude = [ "allianceauth_oidc/migrations/*" ]
ignore_names = [
    # Django signal handler dispatch contract: post_save / post_delete
    # / oidc_token_issued invoke handlers as
    # ``handler(sender, instance, **kwargs)``. ``sender`` is required
    # by the dispatcher even when the body uses only ``instance``.
    "sender",
    # Django ModelAdmin and command framework hooks accept ``request``
    # / ``obj`` / ``args`` / ``options`` per the framework contract;
    # subclasses keep the parameter list even when they only branch on
    # one argument.
    "request",
    "obj",
    # Django ``RunPython(forwards, reverse)`` calls each callback with
    # ``(apps, schema_editor)``. ``schema_editor`` is required by the
    # framework even when the body only touches the apps registry.
    "schema_editor",
    # ``UserLike.has_perm(self, perm: str) -> bool`` is a Protocol
    # method body of ``...`` (the contract IS the implementation), so
    # ``perm`` is "unused" by definition — implementations satisfy the
    # Protocol structurally without referencing the stub.
    "perm",
    # Django system-check API contract: ``check(app_configs, **kwargs)``
    # — the dispatcher requires the positional parameter even when the
    # body operates on the global app registry.
    "app_configs",
]

[tool.coverage.run]
# Branch coverage catches half-covered ``if`` arms even when the
# statement-coverage line-count looks complete; an `if x: a else: b`
# with only the truthy branch tested counts as 100% statement but
# 50% branch coverage. For a security-adjacent codebase that's the
# more honest signal.
branch = true
source = [ "allianceauth_oidc" ]
omit = [
    # Auto-generated; tests check end-state correctness, not migration
    # body coverage.
    "allianceauth_oidc/migrations/*",
    # Tooling shims with no behaviour to cover.
    "allianceauth_oidc/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Stale per-line tracebacks from the matrix-test harness shouldn't
# turn coverage red; the data file is authoritative.
ignore_errors = true
# Enforced floor: ``coverage report`` exits non-zero below this.
# Baseline 96% observed since 2026-05-20 has been stable through the
# strict-mode mypy ramp and the property-test additions, so the
# floor is lifted in lockstep with the observed value. Headroom is
# now 0% — a single missing branch will block the commit, which is
# the right pressure for a security-adjacent codebase. Add headroom
# back (drop to 95) only if a deliberate refactor temporarily
# reduces coverage before the follow-up test pass.
fail_under = 96
# ``exclude_also`` (vs the historical ``exclude_lines``) lets us layer on
# top of coverage's built-in defaults without redeclaring them.
exclude_also = [
    "pragma: no cover",
    # Type-checking imports never execute at runtime.
    "if TYPE_CHECKING:",
    # Abstract methods and explicit not-implemented stubs.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    # CLI entry-points, not exercised under the django test runner.
    "if __name__ == .__main__.:",
    # Defensive guards — present for invariants, not for behaviour.
    "raise AssertionError",
    "if self\\.debug:",
    # ``__repr__`` is debug-only; covering it has no behavioural value.
    "def __repr__",
    # ``assert_never(...)`` marks unreachable union exhaustion — the
    # whole point is that the branch never runs, but coverage still
    # counts it as missed otherwise.
    "assert_never\\(",
    # ``...`` Protocol method bodies are stubs, not behaviour.
    "\\.\\.\\.",
]
