# OIDC / OAuth2 provider-specific Semgrep rules.
#
# Why local rules instead of the registry: semgrep.dev's community
# rulesets (``p/python``, ``p/django``, ``p/jwt``) now require a
# logged-in token to fetch (HTTP 401 anonymously), which would force
# every contributor and CI runner to wire up a SEMGREP_APP_TOKEN.
# These five rules cover the OIDC-specific attack patterns that bandit
# + ruff ``S`` do NOT catch: JWT misuse, outbound SSRF without
# timeout, redirect-target injection, raw-secret logging, and ``alg=
# none`` bypass attempts. Generic OWASP / Django coverage stays with
# the existing bandit + ruff S setup.
#
# Run manually: ``semgrep --config .semgrep/oidc-security.yaml``
# allianceauth_oidc/.
rules:
  - id: jwt-decode-without-algorithms
    message: |
      ``jwt.decode`` without an explicit ``algorithms=`` argument
      accepts ``alg=none`` and key-confusion attacks. Pass the
      whitelist of algorithms the caller expects (e.g.
      ``algorithms=["RS256"]``).
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: jwt.decode($TOK, $KEY)
          - pattern: jose.jwt.decode($TOK, $KEY)
      - pattern-not: jwt.decode($TOK, $KEY, algorithms=...)
      - pattern-not: jose.jwt.decode($TOK, $KEY, algorithms=...)

  - id: jwt-decode-verify-false
    message: |
      ``jwt.decode(..., verify=False)`` disables signature
      verification — only ever acceptable in test fixtures, never in
      production code. Use ``options={"verify_signature": False}``
      with a per-call justification comment if absolutely required.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: jose.jwt.decode(..., verify=False, ...)

  - id: requests-without-timeout
    message: |
      Outbound HTTP call without ``timeout=``. For the back-channel
      logout / introspection / token-validation paths this blocks the
      worker thread indefinitely on a slow RP — set a bounded timeout
      (current project convention is 5-10 seconds).
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: requests.put(...)
          - pattern: requests.delete(...)
          - pattern: requests.patch(...)
          - pattern: requests.request(...)
      - pattern-not: requests.$METHOD(..., timeout=..., ...)

  - id: redirect-from-untrusted-input
    message: |
      ``HttpResponseRedirect`` built directly from ``request.GET`` /
      ``request.POST`` is an open-redirect primitive. OIDC requires
      strict matching of ``redirect_uri`` against the registered
      application — validate the URI through DOT's
      ``Application.redirect_uris`` allow-list before redirecting.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: HttpResponseRedirect(request.GET[...])
      - pattern: HttpResponseRedirect(request.POST[...])
      - pattern: redirect(request.GET[...])
      - pattern: redirect(request.POST[...])

  - id: token-or-secret-in-log-message
    message: |
      Logger call appears to receive a raw token / secret as a
      format argument. All secret values must round-trip through
      ``utils.redact_secret`` and the surrounding dict must come from
      ``utils.build_oidc_debug_meta``; per the project's CLAUDE.md,
      that helper is the only sanctioned path that produces a
      log-safe payload.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: logger.$LEVEL(..., $TOKEN, ...)
      - metavariable-regex:
          metavariable: $TOKEN
          regex: ^(access_token|refresh_token|id_token|client_secret|authorization_code|code_verifier)$

  - id: non-constant-time-token-comparison
    message: |
      Token / secret compared with ``==`` / ``!=``. Timing-attack
      primitive: an attacker measures comparison time to learn the
      shared secret byte by byte. Use ``hmac.compare_digest(a, b)``
      for any string that represents a token, HMAC, signature, or
      client secret.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $TOKEN == $OTHER
          - pattern: $TOKEN != $OTHER
          - pattern: $OTHER == $TOKEN
          - pattern: $OTHER != $TOKEN
      - metavariable-regex:
          metavariable: $TOKEN
          regex: ^(client_secret|access_token|refresh_token|id_token|signature|hmac|csrf_token|auth_token|api_token|secret_key|session_token)$

  - id: mark-safe-on-user-input
    message: |
      ``mark_safe`` / ``format_html`` / ``SafeString`` applied to
      user-controlled input is an XSS primitive. The OIDC consent
      page / admin templates render claim values and redirect URIs
      — if any of those flows through mark_safe without sanitisation,
      the provider becomes an XSS reflector for downstream clients.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: mark_safe(request.GET[...])
      - pattern: mark_safe(request.POST[...])
      - pattern: mark_safe(request.GET.get(...))
      - pattern: mark_safe(request.POST.get(...))
      - pattern: SafeString(request.GET[...])
      - pattern: SafeString(request.POST[...])

  - id: raw-sql-extra-or-raw
    message: |
      Django ORM ``.extra()`` and ``.raw()`` accept SQL fragments that
      bypass parameterisation if interpolated from variables. Use
      keyword params (``params=[...]``) or rewrite as ORM expressions.
      For the OIDC provider this matters at admin filtering / audit
      query call sites where ``client_id`` lookups may be templated.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $QS.extra(where=[f"..."])
      - pattern: $QS.extra(where=["..." + $X])
      - pattern: $QS.raw(f"...")
      - pattern: $QS.raw("..." + $X)

  - id: cookie-missing-secure-flags
    message: |
      ``set_cookie`` call missing ``secure=True`` / ``httponly=True``
      / ``samesite=...``. For an OIDC provider, cookies that carry
      session / CSRF state must be transport-bound (Secure) and
      JS-invisible (HttpOnly); SameSite is required for the consent
      page that submits cross-origin to the RP redirect_uri.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern: $RESPONSE.set_cookie(...)
      - pattern-not: $RESPONSE.set_cookie(..., secure=True, ..., httponly=True, ...)
      - pattern-not: $RESPONSE.set_cookie(..., httponly=True, ..., secure=True, ...)
