# OIDC Conformance Suite stack for the provider.
#
# Layout mirrors the upstream prebuilt setup
# (https://gitlab.com/openid/conformance-suite/-/raw/master/docker-compose-prebuilt.yml)
# extended with our provider container:
#
#   mongodb:  state for the suite (test plans, results)
#   nginx:    TLS terminator on 8443 (cert valid for localhost.emobix.co.uk)
#   server:   the OpenID Conformance Suite Java service
#   provider: our Django provider (Dockerfile.provider)
#
# Networking notes:
# - All four services share the default compose bridge network so the
#   suite reaches our provider via Docker DNS at ``http://provider:8080``.
#   ``run_plan.py`` ships that URL as ``discoveryUrl`` in the plan
#   config; the suite (Java code) and its embedded headless browser
#   both resolve it the same way.
# - The HOST OS must map ``localhost.emobix.co.uk`` to 127.0.0.1 in
#   /etc/hosts (the public DNS record does this too, so usually no
#   action is needed). The host's web browser uses that hostname to
#   open the suite UI on https://localhost.emobix.co.uk:8443/.
#
# Pinned to a specific release for reproducibility; flip ``IMAGE_TAG``
# to ``latest`` to track master.

x-conformance-image: &conformance_image_tag "release-v5.1.45"

services:
  mongodb:
    image: mongo:6.0.13
    restart: unless-stopped
    volumes:
      - conformance_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:${IMAGE_TAG:-release-v5.1.45}
    restart: unless-stopped
    networks:
      # Browser-driven modules follow OIDC redirects to the
      # ``redirect_uri`` (``https://localhost.emobix.co.uk:8443/test/a/conformance/callback``)
      # from inside the suite's HtmlUnit. Without this alias the
      # hostname resolves to 127.0.0.1 inside the suite container —
      # which has nothing on :8443 — and HtmlUnit hits "Connection
      # refused" on every browser test. Aliasing nginx to the public
      # hostname routes the callback through the same TLS terminator
      # the host-side browser uses, so the request lands on the suite
      # itself.
      default:
        aliases:
          - localhost.emobix.co.uk
    ports:
      - "8443:8443"
    depends_on:
      - server
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  server:
    # Build a thin overlay on the upstream conformance image that
    # imports the provider's self-signed CA into Java's truststore at
    # build time. The upstream image's ENTRYPOINT exec's ``java``
    # directly without invoking ``__cacert_entrypoint.sh``, so the
    # eclipse-temurin ``USE_SYSTEM_CA_CERTS=1`` path is bypassed —
    # build-time keytool import is the simpler alternative.
    build:
      context: ./tls
      dockerfile: Dockerfile.suite
      args:
        IMAGE_TAG: ${IMAGE_TAG:-release-v5.1.45}
    restart: unless-stopped
    environment:
      BASE_URL: ${CONFORMANCE_BASE_URL:-https://localhost.emobix.co.uk:8443}
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      # The suite registers Spring OAuth2 clients for its own "Login
      # with Google/GitLab" admin UI; Spring validates the registry at
      # startup and refuses to boot if any of these is empty. Mirror
      # the upstream prebuilt compose's placeholder defaults — we
      # never use the buttons, but the bean must construct.
      OIDC_GOOGLE_CLIENTID: ${OIDC_GOOGLE_CLIENTID:-google-client}
      OIDC_GOOGLE_SECRET: ${OIDC_GOOGLE_SECRET:-google-secret}
      OIDC_GITLAB_CLIENTID: ${OIDC_GITLAB_CLIENTID:-gitlab-client}
      OIDC_GITLAB_SECRET: ${OIDC_GITLAB_SECRET:-gitlab-secret}
    depends_on:
      mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  provider:
    build:
      context: ../..
      dockerfile: tests/conformance/Dockerfile.provider
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: tests.conformance.conformance_settings
      # Suite-side reach to provider is via Docker DNS over HTTPS; the
      # suite enforces ``https://`` for OIDC discovery. The cert is
      # signed by the CA mounted into the suite container above.
      CONFORMANCE_PUBLIC_URL: https://provider:8443/o
      # Client credentials are deliberately NOT set here. seed.py
      # (in-container) and run_plan.py (host, no compose env) both
      # fall back to the defaults in ``runner/config.py`` — the single
      # source of truth. A value pinned here once forked the two
      # sides: compose kept the short ``conformance-secret`` after the
      # runner default grew the >=32-byte HS256 padding, so the app
      # was seeded with one secret while the suite authenticated with
      # another and every token exchange died with 401
      # ``invalid_client``. Guarded by
      # ``tests/unit/test_conformance_compose.py``.
      AA_USE_FAKE_REDIS: "1"
    depends_on:
      mongodb:
        condition: service_healthy
    # Expose 8443 on host:8444 (the suite's nginx already owns
    # host:8443) so a developer can poke the provider directly with
    # ``curl --cacert tls/ca.crt https://localhost:8444/o/...`` while
    # a plan is running. Internal Docker DNS still uses ``provider:8443``.
    ports:
      - "8444:8443"
    healthcheck:
      # ``ssl=False`` not used here: the provider serves a self-signed
      # cert, but we have the CA on disk inside the image (copied at
      # build time), so verify against it for a real round-trip check.
      # The custom User-Agent header lets operators filter healthcheck
      # noise out of the access log when triaging conformance runs —
      # urllib's default ``Python-urllib/3.x`` is indistinguishable
      # from arbitrary Python clients on the network.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import ssl,urllib.request;ctx=ssl.create_default_context(cafile='/app/tests/conformance/tls/ca.crt');req=urllib.request.Request('https://127.0.0.1:8443/o/.well-known/openid-configuration',headers={'User-Agent':'conformance-provider-healthcheck/1.0'});urllib.request.urlopen(req,context=ctx).read()"
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

volumes:
  conformance_mongo_data:
