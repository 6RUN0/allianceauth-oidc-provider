; Vale configuration for ``allianceauth-oidc-provider`` Markdown docs.
;
; Layout
; ------
; - ``styles/`` is the prose-rule directory. Project-shipped contents
;   (``config/vocabularies/AllianceAuthOIDC/``) live there; anything
;   produced by ``vale sync`` (downloaded packages) is gitignored.
; - Russian files (``*.ru.md``) skip the English-prose rules — Vale is
;   English-first; running its lints against translated copy would
;   surface noise instead of issues.
;
; Adding a Style Guide
; --------------------
; To layer in an opinionated guide (Microsoft / Google / proselint /
; write-good), add it under ``Packages`` below and run ``vale sync``
; once. The downloaded styles land in ``styles/`` and are picked up
; automatically. The ``[*.md]`` ``BasedOnStyles`` line enumerates
; which packages apply to which files.
;
; CI: ``nox -s markdown_lint`` calls Vale only when ``.vale.ini``
; exists (``noxfile.py::markdown_lint``); a missing binary or absent
; config silently skips, so the session stays optional.

StylesPath = styles
MinAlertLevel = warning

Vocab = AllianceAuthOIDC

; Built-in Vale rules cover the basic ground (spelling, repetition,
; sentence-length cap). External packages can be appended later — see
; the comment block above. For now the bar is "no obvious
; misspellings, no doubled words, no 50-word sentences".
;
; ``Vale.Terms`` is disabled because the project legitimately uses
; both "OIDC" (acronym in prose) and "oidc" (Python identifier
; / module path) — Terms would force one canonical casing across
; both contexts and surface false positives.
[*.md]
BasedOnStyles = Vale
Vale.Terms = NO

; Russian translations bypass English-prose rules. The structural
; lints live elsewhere (``rumdl`` for Markdown shape, ``lychee`` for
; links) — Vale is the English-prose layer only.
[*.ru.md]
BasedOnStyles =
